name: tests

on:
  push:
  pull_request:

# A new push supersedes whatever was already running for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The two sub-second tiers, kept in their own job so a failure here is
  # reported in under a minute rather than behind the slow ones.
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the services' dependencies
        run: |
          python -m pip install --upgrade pip
          for req in services/*/requirements.txt gateway/requirements.txt; do
            pip install -r "$req"
          done
          pip install -r tests/requirements.txt ruff

      - run: npm ci --prefix frontend

      - name: Lint
        run: |
          python -m ruff check --select F,E9 services/ gateway/ tests/ shared/
          (cd frontend && npx tsc -b)
          (cd frontend && npx oxlint)

      - name: Unit tests
        run: python -m pytest -m unit

      - name: Frontend tests
        run: npm --prefix frontend test

  # The API, in-process, with a fresh database per test.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the services' dependencies
        run: |
          python -m pip install --upgrade pip
          for req in services/*/requirements.txt gateway/requirements.txt; do
            pip install -r "$req"
          done
          pip install -r tests/requirements.txt
      - run: python -m pytest -m integration

  # The real services behind the real gateway, and the built frontend in a
  # real browser. Slowest, so it runs last and on its own.
  system:
    runs-on: ubuntu-latest
    # The whole job normally takes a few minutes. Without a cap, a step that
    # hangs (an apt mirror that stops answering, see below) holds the runner
    # for GitHub's default 6 hours instead of failing.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the services' dependencies
        run: |
          python -m pip install --upgrade pip
          for req in services/*/requirements.txt gateway/requirements.txt; do
            pip install -r "$req"
          done
          pip install -r tests/requirements.txt

      - run: npm ci --prefix frontend

      # `--with-deps` runs apt. When one of the runner's Ubuntu mirrors
      # (azure.archive.ubuntu.com) stops answering, apt's defaults wait on it
      # practically forever -- a run sat on it for 18+ minutes. Short
      # timeouts make apt give up on that mirror and use the others in the
      # runner's mirror list; the step's own cap and a second attempt cover
      # the rest.
      - name: Make apt give up on an unresponsive mirror
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-timeouts
      # Firefox and WebKit are only for test_downloads.py's download paths
      # (tests/README.md, "Known gaps") -- the rest of the e2e tier stays
      # Chromium-only, so this is three browsers' install cost, not three
      # times the suite.
      - name: Install Chromium, Firefox and WebKit, and their system libraries
        timeout-minutes: 12
        run: |
          for attempt in 1 2; do
            timeout 300 python -m playwright install --with-deps chromium firefox webkit && exit 0
            echo "playwright install attempt $attempt failed or timed out -- retrying"
          done
          exit 1

      - run: python -m pytest -m system
      - run: python -m pytest -m e2e

      - name: Keep the service logs when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: /tmp/pytest-of-*/pytest-*/stack*/logs/
          if-no-files-found: ignore

  # The actual install path: docker-compose.yml, unmodified, built and
  # started like the owner's machine would. Every other job only ever
  # imports the Python modules directly or runs them as bare processes, so
  # a broken Dockerfile or a build context that can't reach what it COPYs
  # (see DESIGN_NOTES.md, shared/backup_retention.py) passed every one of
  # them on 2026-10-04 and only broke at `docker compose up --build` on the
  # owner's NAS.
  compose:
    runs-on: ubuntu-latest
    # docker/docker compose come preinstalled on this runner image; building
    # six images from scratch (no layer cache between runs) is the slow
    # part, a few minutes at most.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: tests/compose/smoke.sh
