services:
  core-networth:
    build: ./services/core-networth
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      PRICE_FEED_URL: http://price-feed:8001
    volumes:
      - core_data:/data
      # Daily automatic backup of the database (see app/scheduler.py). Local
      # host folder on purpose, independent of the core_data volume, so a
      # backup survives even if that volume were ever accidentally removed.
      - ./backups/core:/backups
    expose:
      - "8000"

  price-feed:
    build: ./services/price-feed
    restart: unless-stopped
    expose:
      - "8001"

  geo-allocation:
    build: ./services/geo-allocation
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      # Largest single factsheet an upload may be. Passed to the gateway too
      # (see below): the browser posts through the gateway, so both have to
      # agree or the stricter one silently decides.
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-26214400}
    volumes:
      # Local folder holding every uploaded fund/ETF factsheet -- this is the
      # "local project folder" requirement: it lives on the host at
      # ./services/geo-allocation/data/fund-files, easy to back up or inspect.
      - ./services/geo-allocation/data:/data
      # Daily automatic backup of uploaded fund files (see app/scheduler.py).
      - ./backups/geo:/backups
    expose:
      - "8002"

  gateway:
    build: ./gateway
    restart: unless-stopped
    environment:
      CORE_SERVICE_URL: http://core-networth:8000
      PRICE_FEED_URL: http://price-feed:8001
      GEO_ALLOCATION_URL: http://geo-allocation:8002
      # Comma-separated list of origins allowed to call the gateway from a
      # browser. Add your host machine's LAN IP here when deploying, e.g.
      # http://192.168.1.10:4173 -- see .env.example / ALLOWED_ORIGINS.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4173,http://localhost:5173}
      # Optional: if set, every request (except /health) must carry a
      # matching X-API-Key header. Empty by default -- the gateway stays
      # exactly as open as before unless you opt in. See .env.example.
      API_KEY: ${API_KEY:-}
      # Caps the request body the gateway will hold in memory while proxying
      # it on -- the same variable geo-allocation reads, since the only large
      # body that goes through the proxy is a factsheet upload bound for it.
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-26214400}
    depends_on:
      - core-networth
      - price-feed
      - geo-allocation
    ports:
      - "8080:8080"

  # Optional: automatic expense capture from your bank(s) via Enable Banking's
  # Open Banking API. Disabled by default in the sense that it does nothing
  # until you configure ./services/bank-sync/links.yaml -- see that service's
  # README.md for full setup instructions (registering an Enable Banking
  # application, generating a key pair, and authorizing each of your
  # accounts). Safe to leave running unconfigured; it just has nothing to do.
  bank-sync:
    build: ./services/bank-sync
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      CORE_SERVICE_URL: http://core-networth:8000
      ENABLE_BANKING_APP_ID: ${ENABLE_BANKING_APP_ID:-}
      ENABLE_BANKING_PRIVATE_KEY_PATH: /secrets/enable_banking_private_key.pem
      # Must be an address YOUR BROWSER can reach (to complete each bank's
      # login redirect) -- your host machine's LAN IP, or a Tailscale/reverse-proxy
      # HTTPS address if you want to authorize from outside home. Production
      # (non-sandbox) Enable Banking applications require HTTPS here.
      PUBLIC_BASE_URL: ${BANK_SYNC_PUBLIC_BASE_URL:-http://localhost:8003}
    volumes:
      - ./services/bank-sync/data:/data
      - ./services/bank-sync/links.yaml:/data/links.yaml:ro
      - ./services/bank-sync/mcc_categories.yaml:/data/mcc_categories.yaml:ro
      - ./services/bank-sync/secrets:/secrets:ro
    depends_on:
      - core-networth
    ports:
      - "8003:8003"

  frontend:
    build:
      context: ./frontend
      args:
        # Must be reachable from the BROWSER (not from inside Docker), so
        # use your host machine's LAN IP when deploying, e.g.
        # http://192.168.1.10:8080 -- see .env.example / VITE_GATEWAY_URL.
        VITE_GATEWAY_URL: ${VITE_GATEWAY_URL:-http://localhost:8080}
        # Must match the gateway's own API_KEY exactly (or both stay empty).
        # Baked into the built bundle like any other Vite build arg -- fine
        # for this app's threat model (a shared-secret barrier, not real
        # per-user auth), but it means anyone who can read the built
        # frontend can read the key too.
        VITE_API_KEY: ${API_KEY:-}
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "4173:4173"

volumes:
  core_data:
