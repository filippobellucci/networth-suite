[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -q --strict-markers --tb=short
filterwarnings =
    ignore::DeprecationWarning
markers =
    unit: pure functions, no database and no HTTP -- milliseconds, run these constantly
    integration: core-networth's ASGI app in-process, fresh database per test
    system: the real services as separate processes behind the real gateway
    e2e: the built frontend driven in a browser against the whole stack
    slow: takes seconds rather than milliseconds
